name: altamyra
version: 1.0.0
description: Student identifiers and service keys this project handles (redacted before checkpoints are written)
rules:
  - id: bc-pen
    description: BC Personal Education Number (9 digits) when labelled as a PEN
    regex: '(?i)\bPEN\s*(?:number|no\.?|#)?\s*[:=#]?\s*\d{9}\b'
    samples:
      - { input: "Student PEN: 123456789", redacted: true }
      - { input: "pen #987654321", redacted: true }
      - { input: "listening on port 8080", redacted: false }
  - id: maritime-api-key
    description: Maritime API keys (mk_ prefix)
    regex: '\bmk_[A-Za-z0-9_-]{16,}'
    samples:
      - { input: "MARITIME_AGENT_TOKEN=mk_live_abcdefghijklmnop1234", redacted: true }
      - { input: "the mk_ key with the deploy scope", redacted: false }
  - id: google-api-key
    description: Google API keys such as Gemini (AIza prefix)
    regex: '\bAIza[0-9A-Za-z_-]{35}\b'
    samples:
      - { input: "GEMINI_API_KEY=AIzaSyA1234567890abcdefghijklmnopqrstuv", redacted: true }
      - { input: "AIza is the key prefix", redacted: false }
  - id: deepspace-app-owner-jwt
    description: Values of DeepSpace secrets that appear when .dev.vars is printed
    regex: '(?m)^(?:APP_OWNER_JWT|APP_IDENTITY_TOKEN|MARITIME_AGENT_TOKEN|GEMINI_API_KEY)=\S+'
    samples:
      - { input: "APP_IDENTITY_TOKEN=abc.def.ghi", redacted: true }
      - { input: "APP_IDENTITY_TOKEN is generated by deepspace", redacted: false }
